<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modul Tes Psikotes Interaktif</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f0f4f8, #d9e2ec);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .timer {
      font-size: 16px;
      color: #e63946;
      font-weight: bold;
    }

    h2 {
      color: #2b2d42;
      margin-bottom: 10px;
    }

    .question {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .options label {
      display: block;
      margin-bottom: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    input[type="radio"] {
      margin-right: 10px;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 30px;
    }

    button {
      background-color: #0077b6;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #023e8a;
    }

    .submit-btn {
      background-color: #38b000;
    }

    .submit-btn:hover {
      background-color: #2d6a4f;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Soal 3 dari 10</h2>
      <div class="timer">⏱️ 02:15</div>
    </div>

    <div class="question">
      Dalam situasi kerja tim, Anda lebih cenderung untuk:
    </div>

    <form id="quiz-form">
      <div class="options">
        <label><input type="radio" name="answer" value="a"> Mengambil peran pemimpin dan mengarahkan tim</label>
        <label><input type="radio" name="answer" value="b"> Mendengarkan dan mendukung anggota lain</label>
        <label><input type="radio" name="answer" value="c"> Fokus pada tugas individu dan menyelesaikannya sendiri</label>
        <label><input type="radio" name="answer" value="d"> Menyelaraskan pendapat dan menjaga harmoni</label>
      </div>

      <div class="navigation">
        <button type="button" onclick="goToPrevious()">← Sebelumnya</button>
        <button type="button" onclick="goToNext()">Berikutnya →</button>
        <button type="submit" class="submit-btn">Kirim Jawaban</button>
      </div>
    </form>

    <div class="footer">
      Jawaban Anda akan divalidasi sebelum dikirim. Pastikan Anda memilih salah satu opsi.
    </div>
  </div>

  <script>
    function goToPrevious() {
      alert("Navigasi ke soal sebelumnya.");
    }

    function goToNext() {
      const selected = document.querySelector('input[name="answer"]:checked');
      if (!selected) {
        alert("Silakan pilih jawaban sebelum lanjut.");
      } else {
        alert("Navigasi ke soal berikutnya.");
      }
    }

    document.getElementById("quiz-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const selected = document.querySelector('input[name="answer"]:checked');
      if (!selected) {
        alert("Silakan pilih jawaban sebelum mengirim.");
      } else {
        alert("Jawaban berhasil dikirim!");
      }
    });
  </script>
</body>
</html>
