<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lamaran Pekerjaan</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f0f4f8, #d9e2ec);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 700px;
      margin: 50px auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2b2d42;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    select,
    textarea,
    input[type="file"],
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background-color: #0077b6;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #023e8a;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Formulir Lamaran Pekerjaan</h2>
    <form>
      <label for="lowongan">Pilih Lowongan</label>
      <select id="lowongan" name="lowongan" required>
        <option value="">-- Pilih Lowongan --</option>
        <option value="designer">UI/UX Designer</option>
        <option value="developer">Frontend Developer</option>
        <option value="marketing">Digital Marketing</option>
        <!-- Tambahkan opsi dinamis dari database -->
      </select>

      <label for="cover_letter">Surat Lamaran (Cover Letter)</label>
      <textarea id="cover_letter" name="cover_letter" rows="5" placeholder="Tulis surat lamaran Anda di sini..." required></textarea>

      <label for="cv">Pilih CV yang Digunakan</label>
      <select id="cv" name="cv" required>
        <option value="">-- Pilih CV --</option>
        <option value="cv1">CV - Desain Grafis</option>
        <option value="cv2">CV - Pengembangan Web</option>
        <!-- Tambahkan opsi dinamis dari akun pengguna -->
      </select>

      <label for="pertanyaan">Pertanyaan Tambahan dari Perusahaan</label>
      <textarea id="pertanyaan" name="pertanyaan" rows="4" placeholder="Jawab pertanyaan jika tersedia (opsional)"></textarea>

      <button type="submit">Kirim Lamaran</button>
    </form>
    <div class="footer">
      © 2025 Portal Karier Indonesia
    </div>
  </div>
</body>
</html>
