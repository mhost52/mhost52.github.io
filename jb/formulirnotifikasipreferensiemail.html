<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifikasi & Preferensi Email</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f0f4f8, #d9e2ec);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2b2d42;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    .checkbox-group {
      margin-bottom: 20px;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      font-weight: normal;
      margin-bottom: 10px;
    }

    .checkbox-group input {
      margin-right: 10px;
    }

    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background-color: #0077b6;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #023e8a;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Formulir Notifikasi & Preferensi Email</h2>
    <form>
      <label>Jenis Notifikasi yang Diinginkan</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="notif_lowongan" checked> Lowongan kerja terbaru</label>
        <label><input type="checkbox" name="notif_interview"> Undangan interview</label>
        <label><input type="checkbox" name="notif_tips"> Tips karier & pengembangan diri</label>
        <label><input type="checkbox" name="notif_update"> Update platform & fitur baru</label>
      </div>

      <label for="frekuensi">Frekuensi Email</label>
      <select id="frekuensi" name="frekuensi" required>
        <option value="">-- Pilih Frekuensi --</option>
        <option value="harian">Harian</option>
        <option value="mingguan">Mingguan</option>
        <option value="bulanan">Bulanan</option>
        <option value="khusus">Hanya untuk notifikasi penting</option>
      </select>

      <button type="submit">Simpan Preferensi</button>
    </form>
    <div class="footer">
      © 2025 Portal Karier Indonesia
    </div>
  </div>
</body>
</html>
