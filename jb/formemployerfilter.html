<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filter Kandidat</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f0f4f8, #d9e2ec);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2b2d42;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    input[type="text"],
    input[type="checkbox"],
    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .checkbox-group {
      margin-bottom: 20px;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      font-weight: normal;
      margin-bottom: 10px;
    }

    .checkbox-group input {
      margin-right: 10px;
    }

    button {
      background-color: #0077b6;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #023e8a;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Formulir Filter Kandidat</h2>
    <form>
      <label for="skill">Skill yang Dicari</label>
      <input type="text" id="skill" name="skill" placeholder="Contoh: JavaScript, UI/UX, Marketing" required>

      <label for="pengalaman">Pengalaman Minimum (tahun)</label>
      <select id="pengalaman" name="pengalaman">
        <option value="">-- Pilih --</option>
        <option value="0">Fresh Graduate</option>
        <option value="1">1+ Tahun</option>
        <option value="3">3+ Tahun</option>
        <option value="5">5+ Tahun</option>
      </select>

      <label for="lokasi">Lokasi Kandidat</label>
      <input type="text" id="lokasi" name="lokasi" placeholder="Contoh: Jakarta, Bandung">

      <div class="checkbox-group">
        <label>
          <input type="checkbox" name="simpan" checked>
          Simpan pencarian ini
        </label>
        <label>
          <input type="checkbox" name="notifikasi">
          Kirim notifikasi saat kandidat cocok ditemukan
        </label>
      </div>

      <button type="submit">Terapkan Filter</button>
    </form>
    <div class="footer">
      © 2025 Portal Karier Indonesia
    </div>
  </div>
</body>
</html>
