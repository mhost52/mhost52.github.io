<div class="container">
  <h2>Laporan Penyalahgunaan / Konten Palsu</h2>
  <form>
    <label for="kategori">Kategori Laporan</label>
    <select id="kategori" name="kategori" required>
      <option value="">-- Pilih Kategori --</option>
      <option value="penipuan">Penipuan / Lowongan palsu</option>
      <option value="pelecehan">Pelecehan / Konten ofensif</option>
      <option value="spam">Spam / Promosi tidak sah</option>
      <option value="lainnya">Lainnya</option>
    </select>

    <label for="deskripsi">Deskripsi Laporan</label>
    <textarea id="deskripsi" name="deskripsi" rows="5" placeholder="Jelaskan detail kejadian..." required></textarea>

    <label for="bukti">Lampirkan Bukti (opsional)</label>
    <input type="file" id="bukti" name="bukti" accept=".jpg,.png,.pdf">

    <button type="submit">Kirim Laporan</button>
  </form>
  <div class="footer">Tim kami akan meninjau laporan Anda dalam 1–3 hari kerja.</div>
</div>
