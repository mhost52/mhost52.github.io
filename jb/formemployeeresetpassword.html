<div class="container">
  <h2>Reset Password</h2>
  <form>
    <label for="email">Alamat Email Terdaftar</label>
    <input type="email" id="email" name="email" required placeholder="contoh@email.com">

    <label for="new-password">Password Baru</label>
    <input type="password" id="new-password" name="new-password" required placeholder="Minimal 8 karakter">

    <label for="confirm-password">Konfirmasi Password Baru</label>
    <input type="password" id="confirm-password" name="confirm-password" required placeholder="Ulangi password baru">

    <button type="submit">Reset Password</button>
  </form>
  <div class="footer">Pastikan password baru Anda aman dan tidak digunakan di platform lain.</div>
</div>
