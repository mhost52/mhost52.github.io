<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil Perusahaan</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #f0f4f8, #d9e2ec);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #2b2d42;
      margin-bottom: 20px;
    }

    .info {
      margin-bottom: 20px;
    }

    .info label {
      font-weight: 600;
      color: #333;
      display: block;
      margin-bottom: 5px;
    }

    .info p {
      margin: 0 0 15px;
      font-size: 16px;
      color: #555;
    }

    .logo {
      text-align: center;
      margin-top: 20px;
    }

    .logo img {
      max-width: 150px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Profil Perusahaan</h2>

    <div class="info">
      <label>Nama Perusahaan</label>
      <p>PT Maju Jaya Abadi</p>

      <label>Email Bisnis</label>
      <p>kontak@majujaya.co.id</p>

      <label>Nomor Telepon</label>
      <p>+62 812-3456-7890</p>

      <label>Website</label>
      <p><a href="https://www.majujaya.co.id" target="_blank">www.majujaya.co.id</a></p>

      <label>Deskripsi</label>
      <p>PT Maju Jaya Abadi adalah perusahaan teknologi yang berfokus pada pengembangan solusi digital untuk UMKM di Indonesia.</p>
    </div>

    <div class="logo">
      <label>Logo Perusahaan</label>
      <img src="logo-majujaya.png" alt="Logo PT Maju Jaya Abadi">
    </div>

    <div class="footer">
      © 2025 Portal Karier Indonesia
    </div>
  </div>
</body>
</html>
